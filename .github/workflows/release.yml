name: Build & Release my-ktv

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar-cmd: yarn run build:sidecar:win
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecar-cmd: yarn run build:sidecar:mac

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    defaults:
      run:
        working-directory: ./my-ktv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: ./my-ktv/yarn.lock

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: my-ktv/src-tauri

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build Python sidecar UV env
        shell: bash
        working-directory: my-ktv/python-downloader
        run: uv sync

      - name: Build sidecar binary
        working-directory: my-ktv
        run: ${{ matrix.sidecar-cmd }}

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Setup FFmpeg binaries for Windows
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          echo "Downloading FFmpeg for Windows..."
          curl -L -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          unzip -q ffmpeg.zip -d ffmpeg_extracted
          cp ffmpeg_extracted/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe src-tauri/ffmpeg-x86_64-pc-windows-msvc.exe
          rm -rf ffmpeg.zip ffmpeg_extracted

      - name: Setup FFmpeg binaries for macOS Apple Silicon
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          echo "Downloading FFmpeg for macOS ARM64..."
          curl -L -o ffmpeg.zip "https://www.osxexperts.net/ffmpeg6arm.zip"
          unzip -q ffmpeg.zip -d ffmpeg_extracted
          cp ffmpeg_extracted/ffmpeg src-tauri/ffmpeg-aarch64-apple-darwin
          chmod +x src-tauri/ffmpeg-aarch64-apple-darwin
          rm -rf ffmpeg.zip ffmpeg_extracted

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: my-ktv
          tagName: ${{ github.ref_name }}
          releaseName: "my-ktv ${{ github.ref_name }}"
          releaseBody: |
            See the [README](https://github.com/${{ github.repository }}/tree/main/my-ktv) for setup instructions.
          releaseDraft: false
          prerelease: false
