name: Build & Release my-ktv

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar-cmd: yarn run build:sidecar:win
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecar-cmd: yarn run build:sidecar:mac

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    defaults:
      run:
        working-directory: ./my-ktv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: ./my-ktv/yarn.lock

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: my-ktv/src-tauri

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build Python sidecar UV env
        shell: bash
        working-directory: my-ktv/python-downloader
        run: uv sync

      - name: Build sidecar binary
        working-directory: .
        run: ${{ matrix.sidecar-cmd }}

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: my-ktv
          tagName: ${{ github.ref_name }}
          releaseName: "my-ktv ${{ github.ref_name }}"
          releaseBody: |
            See the [README](https://github.com/${{ github.repository }}/tree/main/my-ktv) for setup instructions.

            > **Note:** FFmpeg must be installed on your system for YouTube download functionality.
          releaseDraft: false
          prerelease: false
