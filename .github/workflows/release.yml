name: Build & Release my-ktv

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar-ext: .exe
            sidecar-cmd: |
              cd my-ktv/python-downloader
              uv run pyinstaller --noconfirm --onefile downloader.py
              copy dist\downloader.exe ..\src-tauri\downloader-x86_64-pc-windows-msvc.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecar-ext: ""
            sidecar-cmd: |
              cd my-ktv/python-downloader
              uv run pyinstaller --noconfirm --onefile downloader.py
              cp dist/downloader ../src-tauri/downloader-aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    defaults:
      run:
        working-directory: ./my-ktv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: ./my-ktv/yarn.lock

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: my-ktv/src-tauri

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build Python sidecar
        shell: bash
        working-directory: .
        run: |
          cd my-ktv/python-downloader
          uv sync
          uv run pyinstaller --noconfirm --onefile downloader.py

      - name: Copy sidecar binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          Copy-Item "my-ktv/python-downloader/dist/downloader.exe" "my-ktv/src-tauri/downloader-x86_64-pc-windows-msvc.exe"

      - name: Copy sidecar binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: .
        run: |
          cp my-ktv/python-downloader/dist/downloader my-ktv/src-tauri/downloader-${{ matrix.target }}

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: my-ktv
          tagName: ${{ github.ref_name }}
          releaseName: "my-ktv ${{ github.ref_name }}"
          releaseBody: |
            See the [README](https://github.com/${{ github.repository }}/tree/main/my-ktv) for setup instructions.

            > **Note:** FFmpeg must be installed on your system for YouTube download functionality.
          releaseDraft: false
          prerelease: false
